# ============================================================================
# Workshop Linux — Nginx para Docker Compose ATRÁS do Cloudflare Tunnel
# Usado por docker-compose.yml (cenário §3 do docs/deploy-homelab.md).
#
# - HTTP puro (porta 80): o TLS é terminado na BORDA da Cloudflare. O tráfego
#   entre cloudflared → nginx → app trafega na rede interna do Compose.
# - upstream aponta para o serviço `app` do Compose (não 127.0.0.1).
# - Força X-Forwarded-Proto: https (o cliente real falou HTTPS com a Cloudflare),
#   para o Next gerar URLs absolutas corretas e nunca se achar "inseguro".
# ============================================================================

upstream workshop_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/manifest+json;

    # NÃO duplique CSP/HSTS — o app já emite (next.config.ts + proxy.ts).

    location /_next/static/ {
        proxy_pass http://workshop_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://workshop_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Edge Cloudflare terminou TLS → informa o protocolo real ao app
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
