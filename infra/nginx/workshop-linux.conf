# ============================================================================
# Workshop Linux — Nginx reverse proxy (produção)
# Instalar em: /etc/nginx/sites-available/workshop-linux.conf
#   sudo ln -s /etc/nginx/sites-available/workshop-linux.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANTE: NÃO adicione headers de segurança (CSP/HSTS/X-Frame-Options) aqui.
# A aplicação Next.js já os emite (next.config.ts + proxy.ts). Duplicar faz o
# browser aplicar a INTERSEÇÃO de dois CSP — costuma quebrar o site.
# ============================================================================

# Upstream do app Next.js (server.js standalone ou `next start`) na porta 3000
upstream workshop_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS (301) + desafio ACME do Certbot ────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name workshop.seudominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name workshop.seudominio.com;

    # Certificados gerenciados pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/workshop.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workshop.seudominio.com/privkey.pem;

    # TLS hardening — perfil Mozilla "intermediate" (TLS 1.2 + 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Limite de upload (não há uploads grandes neste app)
    client_max_body_size 2m;

    # Compressão (cobre o que o Nginx serve diretamente)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/manifest+json;

    # Assets versionados (hash imutável no nome) — cache agressivo de 1 ano
    location /_next/static/ {
        proxy_pass http://workshop_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Métricas internas do Nginx (scrape via nginx-prometheus-exporter)
    # Acessível só de localhost — expõe a porta via túnel/rede interna.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # App Next.js
    location / {
        proxy_pass http://workshop_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
