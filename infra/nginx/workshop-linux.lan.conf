# ============================================================================
# Workshop Linux — Nginx LAN-only (Home Lab SEM exposição à internet)
# Cenário §1 do docs/deploy-homelab.md.
#
# - Acessível APENAS dentro da rede local (nada roteável da internet).
# - TLS via mkcert (CA local confiável) — cadeado verde sem Let's Encrypt.
# - SEM bloco ACME (não há Certbot) e SEM redirect para domínio público.
#
# Pré-requisitos no servidor:
#   mkcert -install
#   mkcert workshop.lab            # gera workshop.lab.pem + workshop.lab-key.pem
#   sudo mkdir -p /etc/nginx/certs && sudo cp workshop.lab*.pem /etc/nginx/certs/
# DNS local (split-horizon): aponte workshop.lab -> IP privado do servidor
#   no Pi-hole / AdGuard Home / UniFi (Local DNS Record).
# Instalar: /etc/nginx/sites-available/workshop-linux.lan.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

upstream workshop_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP interno → redireciona para HTTPS local (mkcert). Sem ACME.
server {
    listen 80;
    listen [::]:80;
    server_name workshop.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name workshop.lab;

    # Certificados mkcert (CA local) — válidos só nos dispositivos com a CA instalada
    ssl_certificate     /etc/nginx/certs/workshop.lab.pem;
    ssl_certificate_key /etc/nginx/certs/workshop.lab-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:LanSSL:10m;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/manifest+json;

    # NÃO duplique headers de segurança — o app (next.config.ts + proxy.ts) já emite.

    location /_next/static/ {
        proxy_pass http://workshop_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://workshop_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
